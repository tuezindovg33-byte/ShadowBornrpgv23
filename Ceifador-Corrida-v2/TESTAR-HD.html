<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Nocthar — teste HD 4×</title><style>body{background:#111721;color:#e8ddf4;font:16px system-ui;margin:24px}h1{color:#c6a0ff}button,select{font:inherit;padding:10px;margin:8px;background:#262332;color:#eee;border:1px solid #9a77c9}main{display:flex;gap:24px;flex-wrap:wrap}figure{margin:0;background:#202634;padding:16px}canvas{max-width:100%;image-rendering:pixelated;background:repeating-conic-gradient(#29313f 0 25%,#222a36 0 50%) 0/24px 24px}figcaption{padding:12px 0}p{max-width:880px;line-height:1.5}</style><h1>Nocthar — comparação HD 4×</h1><p>Original e HD aparecem no mesmo tamanho visual. A versão HD foi exportada novamente das artes maiores, com mais detalhe; não é uma simples ampliação do PNG pequeno.</p><select id="mode"><option>idle</option><option>running</option><option>jumping</option><option>attacking</option><option>slash</option></select><button id="play">Pausar</button><input id="frame" type="range" min="0" value="0"><span id="count"></span><main><figure><canvas id="native"></canvas><figcaption>PNG original</figcaption></figure><figure><canvas id="hd"></canvas><figcaption>HD 4× · mesmo tamanho visual</figcaption></figure></main><p id="sizes"></p><script>const config={"idle": {"frames": 11, "width": 1320, "height": 140, "frameWidth": 120, "frameHeight": 140, "framesPerSpriteFrame": 18, "sourceScale": 4, "drawFrameWidth": 30, "drawFrameHeight": 35}, "running": {"frames": 10, "width": 1760, "height": 128, "frameWidth": 176, "frameHeight": 128, "framesPerSpriteFrame": 8, "sourceScale": 4, "drawFrameWidth": 44, "drawFrameHeight": 32}, "jumping": {"frames": 4, "width": 512, "height": 168, "frameWidth": 128, "frameHeight": 168, "framesPerSpriteFrame": 8, "sourceScale": 4, "drawFrameWidth": 32, "drawFrameHeight": 42}, "attacking": {"frames": 7, "width": 1736, "height": 168, "frameWidth": 248, "frameHeight": 168, "framesPerSpriteFrame": 8, "sourceScale": 4, "drawFrameWidth": 62, "drawFrameHeight": 42}, "slash": {"frames": 5, "width": 2460, "height": 120, "frameWidth": 492, "frameHeight": 120, "sourceScale": 4, "drawFrameWidth": 123, "drawFrameHeight": 30}};let mode='idle',index=0,playing=true,last=0;const images={};for(const k of Object.keys(config)){images[k]=[new Image(),new Image()];images[k][0].src='original/'+k+'.png';images[k][1].src='hd-4x/'+k+'.png';images[k].forEach(i=>i.onload=draw)}function draw(){const m=config[mode];document.getElementById('frame').max=m.frames-1;document.getElementById('frame').value=index;document.getElementById('count').textContent=(index+1)+' / '+m.frames;document.getElementById('sizes').textContent='Folha HD: '+m.width+' × '+m.height+' · célula HD: '+m.frameWidth+' × '+m.frameHeight;['native','hd'].forEach((id,n)=>{const c=document.getElementById(id);c.width=m.drawFrameWidth*8;c.height=m.drawFrameHeight*8;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const im=images[mode]?.[n],w=n?m.frameWidth:m.drawFrameWidth,h=n?m.frameHeight:m.drawFrameHeight;if(im?.complete&&im.naturalWidth)ctx.drawImage(im,index*w,0,w,h,0,0,c.width,c.height)})}document.getElementById('mode').onchange=e=>{mode=e.target.value;index=0;last=0;draw()};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pausar':'Reproduzir'};document.getElementById('frame').oninput=e=>{playing=false;index=Number(e.target.value);document.getElementById('play').textContent='Reproduzir';draw()};function tick(t){if(playing&&t-last>=(config[mode].framesPerSpriteFrame||3)*1000/60){index=(index+1)%config[mode].frames;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
